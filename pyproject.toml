[project]
name = "semanticid-llm-rec"
version = "0.1.0"
description = "Semantic ID + RQ-VAE + Qwen LoRA generative recommendation project for interview demos."
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "accelerate>=0.30.0",
    "datasets>=2.19.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "peft>=0.11.0",
    "pyyaml>=6.0.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "torchaudio>=2.2.0",
    "tqdm>=4.66.0",
    "transformers>=4.43.0",
    "trl>=0.9.0",
    "torchinfo>=1.8.0",
]

[dependency-groups]
dev = [
    "black>=24.0.0",
    "mypy>=1.10.0",
    "pytest>=7.4.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
