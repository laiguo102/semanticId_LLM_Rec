# local 配置：本地正式演示。
# 使用完整用户数据，但仍允许本地兜底，目标是“能稳定运行、能展示结果、不卡显存”。
project:
  seed: 2026
  data_root: ../funrec-movielens-1m
  output_dir: outputs

data:
  min_interactions: 5
  max_history_len: 50
  # 留空表示使用全部满足 min_interactions 的用户。
  max_users:
  # 限制 SFT 样本量，避免本地生成过大的 jsonl。
  max_sft_examples: 20000

embedding:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  dim: 384
  batch_size: 64
  # 本地没有模型缓存或网络失败时，允许 fallback 到确定性 hash embedding。
  allow_hash_fallback: true

rqvae:
  input_dim: 384
  hidden_dim: 256
  latent_dim: 64
  codebook_num: 3
  codebook_size: 256
  epochs: 3
  batch_size: 256
  lr: 0.001
  # 本地没有服务器训练好的 RQ-VAE 时，允许 KMeans 兜底生成 SID。
  allow_kmeans_fallback: true

sft:
  base_model: Qwen/Qwen2.5-0.5B-Instruct
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  max_seq_len: 1024
  epochs: 1
  batch_size: 1
  gradient_accumulation_steps: 8
  lr: 0.0002

inference:
  beam_size: 5
  top_k: 10
  # 本地默认不加载 Qwen，只使用可快速运行的推荐后端。
  use_llm: false

eval:
  negative_num: 99
  ks: [5, 10, 20]
  # 本地评估抽样 1000 个用户，速度和指标稳定性折中。
  max_users: 1000
